version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secondnature-app
    ports:
      - "8006:8006"
    environment:
      - PORT=8006
      - INTERNAL_PORT=8007
      # 默认关闭热重载；开发时通过 docker-compose.override.yml 或 .env 设置为 true
      - RELOAD=false
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      # 国内下载 HuggingFace 模型镜像（首次启动需下载约 100 MB 嵌入模型）
      - HF_ENDPOINT=https://hf-mirror.com
      # 模型下载超时，避免无网络环境阻塞启动过久
      - HF_HUB_DOWNLOAD_TIMEOUT=20
      - HF_HUB_ETAG_TIMEOUT=20
    volumes:
      # 后端代码热挂载：修改主机文件后容器内实时生效
      - ./backend:/app/backend
      # 前端构建产物挂载：重新 build 前端后无需重建镜像
      - ./frontend/dist:/app/frontend/dist
      # 数据持久化（SQLite、上传文件、生成的向量索引等）
      - secondnature-data:/app/backend/data
      # HuggingFace 模型缓存持久化，避免每次重建容器都重新下载
      - secondnature-hf-cache:/root/.cache/huggingface
    # 资源限制：4 核 / 8 GB 机器，给容器 3 核 / 6-7 GB，留余量给宿主机
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 7G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  secondnature-data:
    driver: local
  secondnature-hf-cache:
    driver: local
